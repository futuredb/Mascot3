<!doctype html><html lang="ru"><meta charset="utf-8"><title>Автоматическая подготовка света</title>
<style>body{font:16px system-ui;background:#f5f4f0;color:#242827;max-width:1000px;margin:48px auto;padding:0 24px}h1{font-size:32px}button{font:inherit;background:#263e39;color:white;border:0;border-radius:12px;padding:12px 18px;margin:8px 12px 20px 0;cursor:pointer}article{padding:20px;border-top:1px solid #d5d8d1}img{max-width:220px;max-height:260px;object-fit:contain;background:#d9dfd9;margin:10px;border-radius:8px}.state{color:#56635d}code{font-size:13px}p{line-height:1.6}</style>
<h1>Автоматическая подготовка света</h1>
<p>Проверка на сохранённых героях и готовом ролике. Генератор изображений и анимаций не вызывается.</p>
<button id="prepare">Обработать готовые файлы</button><button id="check">Проверить логику и промпты</button>
<button id="production">Проверить обновлённый сервер</button><p id="production-state" class="state"></p>
<p id="checks" class="state">Проверки ещё не запускались</p><main id="jobs"></main>
<script>
const headers={'X-Mascot-Client-Token':'codex-local-preview'};
const jobs=document.querySelector('#jobs');
document.querySelector('#production').onclick=async()=>{await fetch('/production-check',{method:'POST'});};
setInterval(async()=>{const s=await(await fetch('/production-state')).json();document.querySelector('#production-state').textContent=s.status==='passed'?'Сервер проверен: PNG и все 145 кадров видео обработаны, файлы скачаны и проверены':s.status==='failed'?'Сервер: '+s.error:s.stage||'';},2000);
document.querySelector('#check').onclick=async()=>{await fetch('/check',{method:'POST'});};
setInterval(async()=>{const s=await(await fetch('/state')).json();document.querySelector('#checks').textContent=s.status==='passed'?'Все проверки пройдены':s.status==='failed'?'Есть ошибки — см. отчёт':s.stage||'Проверки ещё не запускались';},1500);
document.querySelector('#prepare').onclick=async e=>{
 e.target.disabled=true;
 for(const [file,name] of [['akim.png','Аким · изображение'],['mars.png','Марс · изображение'],['una.png','Уна · изображение'],['una.mp4','Уна · готовая анимация']]){
  const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><p class="state">Загрузка готового файла…</p>`;jobs.append(article);
  const buffer=await(await fetch('/fixtures/'+file)).arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const url='/v1/lighting/sources/'+(file.endsWith('.png')?'image':'video')+'/'+hash;
  const response=await fetch(url,{method:'PUT',headers,body:buffer});let job=await response.json();
  if(!response.ok){article.querySelector('p').textContent=JSON.stringify(job);continue;}
  const timer=setInterval(async()=>{
   job=await(await fetch('/v1/lighting/jobs/'+job.id,{headers})).json();article.querySelector('p').textContent=({queued:'В очереди',running:'Рассчитываем карты',ready:'Готово · исходный файл сохранён',failed:'Обработка не удалась'})[job.status];
   if(job.status==='ready'||job.status==='failed')clearInterval(timer);
   if(job.status==='ready'){
    const manifestFile=job.files.find(f=>f.file==='manifest.json');const manifest=await(await fetch(manifestFile.url,{headers})).json();
    const map=job.files.find(f=>f.file==='body_depth.png'||f.file==='normals-000.png');const blob=await(await fetch(map.url,{headers})).blob();
    const img=document.createElement('img');img.src=URL.createObjectURL(blob);img.alt='Подготовленная карта '+name;article.append(img);
    const info=document.createElement('p');info.textContent=manifest.timestamps_us?`${manifest.timestamps_us.length} кадров · синхронизация по времени исходного видео`:'Карта глубины и рельефная сетка готовы';article.append(info);
   }
  },2000);
 }
};
</script></html>
