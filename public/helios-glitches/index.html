<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helios · выбранные глитчи</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15151b;color:#f0eff6;font:14px/1.5 system-ui,sans-serif}main{max-width:1050px;padding:36px 24px;margin:auto}header{border-bottom:1px solid #33333f;padding-bottom:20px;margin-bottom:25px}h1{font-size:28px;margin:0 0 8px;letter-spacing:-1px}p{color:#aaa8bd;margin:0}button{font:inherit;cursor:pointer;border:1px solid #4c4b5d;background:#282631;color:#f0eff6;border-radius:9px;padding:10px 15px}button:hover{border-color:#c1b4ff}button:disabled{opacity:.5;cursor:wait}.heroes{display:flex;gap:8px;margin:16px 0}.heroes button[aria-pressed=true]{border-color:#c1b4ff;background:#343044}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:22px 12px;background:#1d1d25;border:1px solid #33333f;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:12px}.circle{width:136px;height:136px;border-radius:50%;background:#eaebec;overflow:hidden;border:1px solid white}.circle canvas{width:100%;height:100%;display:block}.card span{color:#aaa8bd;font-size:12px}#checks{margin-top:24px;border-top:1px solid #33333f;padding-top:16px}#checks p{margin:8px 0}#checks .pass{color:#92d6ba}#checks .fail{color:#ff6a85}#build{margin:20px 0;font-size:13px}@media(max-width:620px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style>
<main><header><h1>Глитчи в цвет персонажа</h1><p>Шесть переходов · палитра каждого героя · прозрачные слои · 600 мс</p></header>
<p id="hero-caption">Персонаж из основного билда. Для скринкаста можно переключаться между героями; эффекты повторяются автоматически.</p>
<div id="heroes" class="heroes" aria-label="Персонажи"></div>
<div class="actions"><button id="play" disabled>Повторить переход</button><button id="pixel-check" disabled>Проверить 6 эффектов</button><button id="validate">Проверить и собрать основной APK</button></div>
<p id="build" role="status"></p><div id="grid" class="grid"></div><div id="checks" aria-live="polite"></div>
</main><script type="module" src="/preview.js"></script></html>
